    <link
        rel="manifest"
        href="assets/images/BrandAssets/VIS_Brand_Assets_v1.0/03_Favicons/site.webmanifest"
    >

    <script>
        (function () {
            const supportedLanguages = ["en", "ru", "es"];
            const defaultLanguage = "en";

            function redirectToLanguage(language) {
                window.location.replace("./" + language + "/");
            }

            try {
                const savedLanguage = localStorage.getItem("vis-language");

                if (savedLanguage && supportedLanguages.includes(savedLanguage)) {
                    redirectToLanguage(savedLanguage);
                    return;
                }
            } catch (error) {
                // Continue with browser-language detection when localStorage is unavailable.
            }

            const browserLanguage = (
                navigator.language ||
                navigator.userLanguage ||
                defaultLanguage
            )
                .substring(0, 2)
                .toLowerCase();

            redirectToLanguage(
                supportedLanguages.includes(browserLanguage)
                    ? browserLanguage
                    : defaultLanguage
            );
        })();
    </script>

    <noscript>
        <meta http-equiv="refresh" content="0; url=./en/">
    </noscript>
